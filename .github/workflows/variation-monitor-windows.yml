name: Variation Monitor Windows EXE
on:
  pull_request:
    paths:
      - 'variation-monitor/**'
      - '.github/workflows/variation-monitor-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: variation-monitor
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Prepare update payload
        working-directory: variation-monitor
        run: python package_update.py
      - name: Test comparison and imports
        working-directory: variation-monitor
        run: python -m unittest discover -v
      - name: Build Windows executable
        working-directory: variation-monitor
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Amazon-Variation-Monitor --add-data "payload;payload" --hidden-import app --hidden-import selftest --collect-all playwright launcher.py
      - name: Smoke-test packaged EXE offline
        working-directory: variation-monitor
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'variation-monitor-selftest'
          New-Item -ItemType Directory -Force qa | Out-Null
          $output = Join-Path (Get-Location) 'qa/selftest.json'
          $p = Start-Process -FilePath 'dist/Amazon-Variation-Monitor.exe' -ArgumentList @('--self-test', $output) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Packaged app test timed out' }
          if ($p.ExitCode -ne 0) { throw "Packaged app failed: $($p.ExitCode)" }
          $result = Get-Content $output | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged app self-test failed' }
          Get-Content $output
      - name: Package delivery
        working-directory: variation-monitor
        shell: pwsh
        run: |
          Copy-Item README.txt dist/Anleitung.txt
          Get-FileHash dist/Amazon-Variation-Monitor.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Amazon-Variation-Monitor-0.4.0-Windows
          path: variation-monitor/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Variation-Monitor-Windows-QA
          path: variation-monitor/qa/*
          retention-days: 14
      - name: Prepare verified EXE transfer parts
        working-directory: variation-monitor
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          data=Path('dist/Amazon-Variation-Monitor.exe').read_bytes()
          Path('parts').mkdir()
          size=24*1024*1024
          for i,start in enumerate(range(0,len(data),size)):
              Path(f'parts/exe.part{i}').write_bytes(data[start:start+size])
          Path('parts/manifest.json').write_text(json.dumps({'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part0
          path: variation-monitor/parts/exe.part0
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part1
          path: variation-monitor/parts/exe.part1
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part2
          path: variation-monitor/parts/exe.part2
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-manifest
          path: variation-monitor/parts/manifest.json
