name: Variation Monitor bundle verification
on:
  pull_request:
    paths:
      - 'variation-monitor/**'
      - '.github/workflows/variation-monitor-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime dependencies
        working-directory: variation-monitor
        run: python -m pip install -r requirements.txt
      - name: Build source update bundle only
        working-directory: variation-monitor
        run: python package_update.py
      - name: Unit and compatibility tests
        working-directory: variation-monitor
        run: python -m unittest discover -v
      - name: Test Excel upload, multi-market snapshots and exports in Edge
        working-directory: variation-monitor
        run: python snapshot_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Variation-Monitor-Snapshot-QA
          path: variation-monitor/qa/*
          retention-days: 14
