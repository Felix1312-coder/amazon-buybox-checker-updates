name: Update-Metadaten fertigstellen

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.2.7"
      INSTALLER: Amazon-Buy-Box-Checker-Team-Setup-1.2.7.exe
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Installer aus Release laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "v${VERSION}" --pattern "${INSTALLER}" --dir release

      - name: Blockmap erzeugen
        run: |
          npm init -y
          npm install --no-save app-builder-bin
          APP_BUILDER="$(node -p "require('app-builder-bin').appBuilderPath")"
          chmod +x "$APP_BUILDER"
          "$APP_BUILDER" blockmap --input="release/${INSTALLER}" --output="release/${INSTALLER}.blockmap" --compression=gzip > release/blockmap-result.json

      - name: latest.yml erzeugen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('release/blockmap-result.json', 'utf8'));
          const version = process.env.VERSION;
          const installer = process.env.INSTALLER;
          const yml = [
            'version: ' + version,
            'files:',
            '  - url: ' + installer,
            '    sha512: ' + meta.sha512,
            '    size: ' + meta.size,
            'path: ' + installer,
            'sha512: ' + meta.sha512,
            "releaseDate: '" + new Date().toISOString() + "'",
            ''
          ].join('\n');
          fs.writeFileSync('release/latest.yml', yml);
          NODE

      - name: Metadaten ins Release laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" "release/${INSTALLER}.blockmap" release/latest.yml --clobber
