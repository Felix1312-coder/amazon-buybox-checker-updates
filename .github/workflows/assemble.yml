name: Assemble approved encrypted Workspace 0.2.10
on:
  push:
    branches: [workspace-build-0.2.10]
    paths: ['parts/**', '.github/workflows/assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify encrypted bytes
        run: |
          mkdir -p assembled
          cat parts/000.part parts/001.part parts/002.part parts/003.part parts/004.part > assembled/0.2.10.bundle.gz
          echo 'f0a4c368dd5e15a9bfa0c3eb5d8a9964c9d6e0038f4f1cc7d92ed009267bec98  assembled/0.2.10.bundle.gz' | sha256sum -c -
          test "$(git hash-object assembled/0.2.10.bundle.gz)" = '3898feccf55f49de3e6d93848ebc907ccf45ab5a'
      - name: Save verified artifact on preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assembled/0.2.10.bundle.gz
          git commit -m 'Assemble verified encrypted Workspace 0.2.10'
          git push origin HEAD:workspace-build-0.2.10
