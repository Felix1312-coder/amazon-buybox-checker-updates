name: Assemble encrypted Workspace 0.2.12
on:
  push:
    branches: [workspace-build-0.2.12]
    paths: ['parts/**', '.github/workflows/assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified encrypted update
        run: |
          mkdir -p assembled
          cat parts/000.part parts/001.part parts/002.part parts/003.part parts/004.part > assembled/0.2.12.bundle.gz
          echo 'd5cd604de760cc66858dcfcad415386dbb63ca5951922447c1b3fa4d70d590bc  assembled/0.2.12.bundle.gz' | sha256sum -c -
          test "$(git hash-object assembled/0.2.12.bundle.gz)" = 'e69206815073297ad496aedc0359faa2adab739b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assembled/0.2.12.bundle.gz
          git commit -m 'Assemble verified encrypted Workspace 0.2.12'
          git push origin HEAD:workspace-build-0.2.12
