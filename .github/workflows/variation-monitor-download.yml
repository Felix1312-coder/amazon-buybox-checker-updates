name: Prepare Variation Monitor download
on:
  pull_request:
    paths:
      - '.github/workflows/variation-monitor-download.yml'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Amazon-Variation-Monitor-0.2.0-Windows
          run-id: 37306296788
          github-token: ${{ github.token }}
          path: release
      - name: Split verified executable for transfer
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          data=Path('release/Amazon-Variation-Monitor.exe').read_bytes()
          Path('parts').mkdir()
          size=24*1024*1024
          for i,start in enumerate(range(0,len(data),size)):
              Path(f'parts/exe.part{i}').write_bytes(data[start:start+size])
          Path('parts/manifest.json').write_text(json.dumps({'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part0
          path: parts/exe.part0
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part1
          path: parts/exe.part1
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-part2
          path: parts/exe.part2
      - uses: actions/upload-artifact@v4
        with:
          name: Variation-EXE-manifest
          path: parts/manifest.json
